name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # The 24.04 runner image has no Python 3.9 build, so the matrix runs on 22.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the package tests
        run: python -m pytest
      - name: Check the goldens the JavaScript engine is tested against
        run: python -m driftaudit._golden --check

  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run the toolkit tests
        working-directory: toolkit
        env:
          DRIFT_SEEDS: "1,2,3,4,5"
        run: python -m pytest tests

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the JavaScript tests
        run: node --test tests/js/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
      - name: Run the command line
        run: |
          export PATH="$RUNNER_TEMP/clean/bin:$PATH"
          driftaudit --version
          driftaudit run --n-dev 20 --n-eval 30 --rounds 4 -o /tmp/r.json
          driftaudit audit /tmp/r.json
          driftaudit validate /tmp/r.json
      - name: Serve the bundled workbench
        run: |
          export PATH="$RUNNER_TEMP/clean/bin:$PATH"
          driftaudit demo --no-open --port 8765 &
          server=$!
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ > /dev/null
          curl -fsS http://127.0.0.1:8765/data/index.json > /dev/null
          curl -fsS http://127.0.0.1:8765/data/runs/paper/seed1.json > /dev/null
          kill "$server"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run the browser suites
        run: node tests/e2e/run.cjs
